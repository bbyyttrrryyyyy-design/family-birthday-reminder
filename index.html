<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f9f4f1"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="亲人生日"><title>亲人生日</title><meta name="description" content="记录亲人农历或阳历生日，并生成苹果日历提前15天提醒。"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg" type="image/svg+xml"><style>
:root{--bg:#f9f4f1;--ink:#452e2a;--muted:#9d776f;--accent:#b56556;--soft:#f9e8e2}*{box-sizing:border-box}body{margin:0;overflow-x:hidden;background:#eee5e1;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.app{width:100%;max-width:540px;min-height:100dvh;margin:auto;overflow:hidden;background:linear-gradient(145deg,#fffaf7,var(--bg));padding:calc(22px + env(safe-area-inset-top)) 20px calc(96px + env(safe-area-inset-bottom));position:relative}.head{display:flex;align-items:center;justify-content:space-between;gap:12px}.eyebrow{font-size:14px;color:#b27769;margin-bottom:4px}h1{font-size:34px;letter-spacing:-1px;margin:0;font-weight:850}.sub{font-size:15px;color:var(--muted);margin:9px 0 24px}.round-btn{border:1px solid #eac0b6;background:linear-gradient(145deg,#d18b7b,#a95e50);color:#fff;width:54px;height:54px;border-radius:19px;font-size:29px;box-shadow:8px 10px 19px #d5c5c0,-5px -5px 14px #fff;cursor:pointer}.stats{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}.surface{border:1.5px solid rgba(255,255,255,.95);box-shadow:9px 11px 22px rgba(94,57,49,.14),-7px -7px 18px #fff,inset 1px 1px 0 #fff;background:linear-gradient(150deg,#fff,#f7e8e3);border-radius:25px}.stat{height:108px;padding:18px 20px}.stat:nth-child(2){background:linear-gradient(150deg,#fffdf9,#eee4d6)}.stat span{font-size:13px;color:var(--muted)}.stat strong{display:block;font-size:32px;color:var(--accent);margin-top:7px}.stat:nth-child(2) strong{color:#a9793f}.section{display:flex;align-items:end;justify-content:space-between;margin:31px 3px 15px}.section h2{font-size:22px;margin:0}.chip{border:0;background:#fffaf8;color:var(--muted);padding:8px 12px;border-radius:18px;box-shadow:3px 5px 11px rgba(99,62,54,.11),-3px -3px 8px #fff;font-size:13px}.list{display:flex;flex-direction:column;gap:17px}.card{padding:18px;min-height:165px;position:relative}.card.soon{background:linear-gradient(150deg,#fff,#f7ddd5)}.top{display:flex;align-items:center}.icon{width:48px;height:48px;display:grid;place-items:center;border-radius:15px;color:white;font-size:19px;background:linear-gradient(145deg,#d18b7b,#a95e50);box-shadow:5px 7px 13px rgba(99,52,44,.28),-3px -3px 8px #fff;border:1px solid #efb5a8}.name{min-width:0;font-size:21px;font-weight:800;margin-left:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.days{margin-left:auto;background:#ffffffb7;color:var(--accent);padding:8px 11px;border-radius:17px;font-size:14px;font-weight:750}.label{font-size:12px;color:var(--muted);margin:15px 0 4px}.date{font-size:20px;font-weight:800}.track{height:5px;background:#eadbd6;border-radius:6px;position:absolute;left:18px;right:18px;bottom:16px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#b96757,#d58b7c);border-radius:6px}.empty{text-align:center;padding:35px 20px}.actions{position:fixed;z-index:3;bottom:calc(12px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(calc(100% - 40px),500px);display:grid;grid-template-columns:repeat(3,1fr);padding:8px;background:#fffaf8ed;backdrop-filter:blur(14px);border-radius:25px;box-shadow:0 12px 28px rgba(76,46,41,.2),inset 0 1px 0 #fff}.nav{border:0;background:none;color:#a47f77;padding:5px;font-size:13px}.nav b{display:block;font-size:21px;margin-bottom:3px}.nav.active{color:var(--accent);font-weight:800}.status{font-size:12px;color:var(--muted);text-align:center;margin:20px 5px 0;line-height:1.6}.modal{position:fixed;z-index:10;inset:0;background:#5b403a66;display:none;align-items:flex-end;justify-content:center}.modal.open{display:flex}.sheet{width:min(100%,540px);max-height:91dvh;overflow:auto;background:var(--bg);border-radius:28px 28px 0 0;padding:22px 20px calc(25px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px #50342d38}.sheet h3{font-size:23px;margin:0 0 17px}.field{margin:13px 0}.field label{display:block;color:var(--muted);font-size:14px;margin-bottom:6px}.field input,.field select{width:100%;font:inherit;font-size:17px;border:1px solid #e5d5cf;border-radius:14px;padding:13px;background:#fff;color:var(--ink)}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.preview{white-space:pre-line;padding:15px;background:#f7e4dd;border-radius:16px;color:#965648;line-height:1.7}.buttons{display:flex;gap:10px;margin-top:20px}.buttons button{flex:1;border:0;border-radius:15px;padding:13px;font:inherit;font-weight:700;background:#eee1dc;color:var(--ink)}.buttons .primary{background:var(--accent);color:#fff}.danger{color:#a63c2c!important}.notice{padding:15px;border-radius:17px;background:#f5e9df;line-height:1.7;font-size:14px;color:#785e56}.install-list{padding-left:22px;line-height:1.9}.toast{position:fixed;z-index:20;top:calc(15px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-130%);background:#4b3430;color:#fff;padding:11px 17px;border-radius:17px;transition:.25s;box-shadow:0 8px 20px #0003}.toast.show{transform:translate(-50%,0)}@media(min-width:700px){.app{margin:24px auto;border-radius:36px;min-height:calc(100dvh - 48px);box-shadow:0 25px 60px #61483e2b}.actions{bottom:28px}}
</style></head><body><main class="app"><header class="head"><div><div class="eyebrow">亲人生日</div><h1>重要的日子</h1></div><button class="round-btn" id="addTop" aria-label="添加生日">＋</button></header><p class="sub">固定农历生日，每年自动换算阳历</p><section class="stats"><div class="surface stat"><span>已记录亲人</span><strong id="total">0</strong></div><div class="surface stat"><span>未来 15 天生日</span><strong id="soon">0</strong></div></section><div class="section"><h2>生日列表</h2><span class="chip">按日期排序</span></div><section class="list" id="list"></section><p class="status">生日只保存在这台手机 · 点击卡片修改<br>安装日历提醒后，系统会提前 15 天通知</p></main><nav class="actions"><button class="nav active"><b>♥</b>生日</button><button class="nav" id="addNav"><b>＋</b>添加</button><button class="nav" id="settingsNav"><b>⚙</b>设置</button></nav><div class="modal" id="editModal"><div class="sheet"><h3 id="editTitle">添加亲人生日</h3><div class="field"><label>姓名</label><input id="name" maxlength="60" placeholder="例如：妈妈"></div><div class="field"><label>生日记录方式</label><select id="mode"><option value="lunar">固定农历月日</option><option value="solar">固定阳历月日</option><option value="known">从已知阳历日期换算农历</option></select></div><div id="monthDay" class="two"><div class="field"><label>月份</label><input id="month" inputmode="numeric" type="number" min="1" max="12" value="6"></div><div class="field"><label>日期</label><input id="day" inputmode="numeric" type="number" min="1" max="30" value="19"></div></div><div class="field" id="leapWrap"><label><input id="leap" type="checkbox" style="width:auto"> 闰月生日（普通月份不用勾）</label></div><div class="field" id="knownWrap" hidden><label>已知阳历日期</label><input id="known" type="date"></div><div class="field"><label>备注 / 关系（选填）</label><input id="note" maxlength="200"></div><div id="preview" class="preview"></div><div class="buttons"><button id="cancelEdit">取消</button><button class="danger" id="deleteEdit" hidden>删除</button><button class="primary" id="saveEdit">保存</button></div></div></div><div class="modal" id="settingsModal"><div class="sheet"><h3>设置</h3><div class="notice">苹果手机无需安装包。先把网页添加到主屏幕，再把生日提醒导入系统日历。</div><ol class="install-list"><li>在 Safari 点底部“分享”按钮</li><li>选择“添加到主屏幕”</li><li>打开桌面的“亲人生日”</li><li>回到这里点击“安装日历提醒”</li></ol><div class="buttons" style="flex-direction:column"><button class="primary" id="calendarBtn">安装日历提醒（未来 20 年）</button><button id="backupBtn">导出生日备份</button><button id="importBtn">导入生日备份</button><input id="importFile" type="file" accept="application/json" hidden><button id="closeSettings">关闭</button></div></div></div><div class="toast" id="toast"></div><script>
'use strict';const KEY='family-birthdays-v1';let years={},people=[],editing=null;const $=id=>document.getElementById(id);const pad=n=>String(n).padStart(2,'0');const utc=(y,m,d)=>Date.UTC(y,m-1,d)/86400000;const todayDay=()=>{let d=new Date();return utc(d.getFullYear(),d.getMonth()+1,d.getDate())};
async function init(){const txt=await fetch('/lunar.csv').then(r=>r.text());txt.trim().split(/\r?\n/).forEach(line=>{const c=line.split(',');years[+c[0]]={start:Date.parse(c[1]+'T00:00:00Z')/86400000,leap:+c[2],days:c.slice(3).map(Number)}});try{people=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(people))throw 0}catch{people=[];toast('本机生日数据损坏，已暂停读取，请导入备份恢复')};render();if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js')}
function lunarFrom(day){let found;for(let y=1901;y<=2100;y++){if(years[y].start<=day)found=y;else break}if(!found)throw Error('日期超出农历范围');let o=day-years[found].start,raw=1,v=years[found];while(raw<=v.days.length&&o>=v.days[raw-1]){o-=v.days[raw-1];raw++}if(raw>v.days.length)throw Error('日期超出农历范围');return{year:found,month:v.leap&&raw>=v.leap?raw-1:raw,day:o+1,leap:v.leap===raw}}
function solar(y,m,d,leap,strict=false){let v=years[y];if(!v||m<1||m>12||d<1||d>30)throw Error('请填写有效农历日期');let matching=v.leap===m+1;if(strict&&leap&&!matching)throw Error('这一年没有对应闰月');let raw=m;if(v.leap&&m>=v.leap)raw++;if(leap&&matching)raw=v.leap;let count=v.days[raw-1];if(strict&&d>count)throw Error('这个农历月只有 '+count+' 天');return v.start+v.days.slice(0,raw-1).reduce((a,b)=>a+b,0)+Math.min(d,count)-1}
function annual(p,y){if(p.lunar)return solar(y,p.month,p.day,p.leap);let d=Math.min(p.day,new Date(Date.UTC(y,p.month,0)).getUTCDate());return utc(y,p.month,d)}function next(p,today=todayDay()){let start=p.lunar?lunarFrom(today).year:new Date(today*86400000).getUTCFullYear();for(let y=start;y<=2100;y++){let d=annual(p,y);if(d>=today)return d}throw Error('超出支持范围')}
function dayText(day){let d=new Date(day*86400000);return `${d.getUTCFullYear()} 年 ${d.getUTCMonth()+1} 月 ${d.getUTCDate()} 日`}function rule(p){return `${p.lunar?'农历':'阳历'} ${p.leap&&p.lunar?'闰':''}${p.month} 月 ${p.day} 日`}function save(){localStorage.setItem(KEY,JSON.stringify(people));render()}
function render(){let today=todayDay(),items=people.map(p=>{try{return{p,n:next(p,today)}}catch{return{p,n:Infinity}}}).sort((a,b)=>a.n-b.n);$('total').textContent=people.length;$('soon').textContent=items.filter(x=>x.n-today>=0&&x.n-today<=15).length;$('list').innerHTML=items.length?'':'<div class="surface empty"><b>还没有生日记录</b><p>点击右上角＋，记下第一个重要的日子</p></div>';for(const x of items){let days=x.n===Infinity?null:x.n-today,near=days!==null&&days<=15,progress=days===null?0:Math.max(4,100-Math.min(days,365)*100/365),card=document.createElement('article');card.className='surface card'+(near?' soon':'');card.innerHTML=`<div class="top"><div class="icon">${near?'♥':days<=90?'✦':'●'}</div><div class="name"></div><div class="days">${days===null?'超出范围':days===0?'今天生日':'还剩 '+days+' 天'}</div></div><div class="label">阳历生日</div><div class="date">${x.n===Infinity?'无法计算':dayText(x.n)}</div><div class="track"><div class="fill" style="width:${progress}%"></div></div>`;card.querySelector('.name').textContent=x.p.name;card.onclick=()=>openEdit(x.p.id);$('list').appendChild(card)}}
function modal(id,on){$(id).classList.toggle('open',on)}function openEdit(id=null){editing=id;let p=id?people.find(x=>x.id===id):{name:'',note:'',lunar:true,leap:false,month:6,day:19};$('editTitle').textContent=id?'修改生日':'添加亲人生日';$('name').value=p.name;$('note').value=p.note||'';$('mode').value=p.lunar?'lunar':'solar';$('month').value=p.month;$('day').value=p.day;$('leap').checked=!!p.leap;$('deleteEdit').hidden=!id;toggleFields();updatePreview();modal('editModal',true)}
function draft(){let mode=$('mode').value,p={id:editing||crypto.randomUUID(),name:$('name').value.trim(),note:$('note').value.trim(),lunar:mode!=='solar',leap:false,month:+$('month').value,day:+$('day').value};if(mode==='known'){if(!$('known').value)throw Error('请选择已知阳历日期');let a=$('known').value.split('-').map(Number),l=lunarFrom(utc(a[0],a[1],a[2]));p.month=l.month;p.day=l.day;p.leap=l.leap}else p.leap=mode==='lunar'&&$('leap').checked;if(!p.name)throw Error('请填写姓名');if(p.lunar){let ok=false;for(let y=1901;y<=2100;y++){try{solar(y,p.month,p.day,p.leap,true);ok=true;break}catch{}}if(!ok)throw Error('无效的农历月日')}else if(p.month<1||p.month>12||p.day<1||p.day>31)throw Error('请填写有效阳历月日');return p}
function toggleFields(){let m=$('mode').value;$('knownWrap').hidden=m!=='known';$('monthDay').hidden=m==='known';$('leapWrap').hidden=m!=='lunar'}function updatePreview(){try{let p=draft(),n=next(p),r=n-15;$('preview').textContent=`每年 ${rule(p)}\n下一次阳历生日：${dayText(n)}\n提前 15 天提醒：${dayText(r)}`}catch(e){$('preview').textContent=e.message}}
function download(name,type,text){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}function icsDate(day,h=9){let d=new Date(day*86400000);return `${d.getUTCFullYear()}${pad(d.getUTCMonth()+1)}${pad(d.getUTCDate())}T${pad(h)}0000`}function escapeICS(s){return String(s).replace(/\\/g,'\\\\').replace(/,/g,'\\,').replace(/;/g,'\\;').replace(/\n/g,'\\n')}
function calendarFile(){if(!people.length)throw Error('请先添加亲人生日');let now=new Date(),start=now.getFullYear(),out=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Family Birthdays//CN','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:亲人生日','X-WR-TIMEZONE:Asia/Shanghai'];for(const p of people)for(let y=start;y<Math.min(start+20,2101);y++){let b=annual(p,y);if(b<todayDay())continue;out.push('BEGIN:VEVENT',`UID:${p.id}-${y}@family-birthdays`,`DTSTAMP:${icsDate(todayDay(),0)}Z`,`DTSTART;TZID=Asia/Shanghai:${icsDate(b)}`,`DTEND;TZID=Asia/Shanghai:${icsDate(b,10)}`,`SUMMARY:${escapeICS(p.name+'的生日')}`,`DESCRIPTION:${escapeICS('每年 '+rule(p))}`,'BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${escapeICS(p.name+'的生日还有15天')}`,'TRIGGER:-P15D','END:VALARM','END:VEVENT')}out.push('END:VCALENDAR');download('亲人生日提醒.ics','text/calendar;charset=utf-8',out.join('\r\n'));toast('日历文件已生成，请选择“添加全部”')}
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2600)}$('addTop').onclick=$('addNav').onclick=()=>openEdit();$('settingsNav').onclick=()=>modal('settingsModal',true);$('cancelEdit').onclick=()=>modal('editModal',false);$('closeSettings').onclick=()=>modal('settingsModal',false);$('mode').onchange=()=>{toggleFields();updatePreview()};for(const id of['name','month','day','leap','known'])$(id).oninput=updatePreview;$('saveEdit').onclick=()=>{try{let p=draft(),i=people.findIndex(x=>x.id===p.id);if(i>=0)people[i]=p;else people.push(p);save();modal('editModal',false);toast('生日已保存')}catch(e){toast(e.message)}};$('deleteEdit').onclick=()=>{if(confirm('确定删除这条生日吗？')){people=people.filter(x=>x.id!==editing);save();modal('editModal',false)}};$('calendarBtn').onclick=()=>{try{calendarFile()}catch(e){toast(e.message)}};$('backupBtn').onclick=()=>download('亲人生日备份.json','application/json',JSON.stringify(people,null,2));$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader;r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x))throw 0;if(confirm(`备份有 ${x.length} 条生日，是否替换当前数据？`)){people=x;save();toast('备份已导入')}}catch{toast('备份文件无效')}};r.readAsText(f)};document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)modal(m.id,false)}));init().catch(e=>{document.body.innerHTML='<p style="padding:30px">应用加载失败，请联网刷新：'+e.message+'</p>'});
</script></body></html>
